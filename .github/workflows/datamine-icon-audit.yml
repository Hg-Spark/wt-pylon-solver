name: Datamine icon audit

on:
  push:
    branches:
      - analysis/datamine-icon-audit-20261110

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Checkout Datamine icon directory
        uses: actions/checkout@v4
        with:
          repository: gszabi99/War-Thunder-Datamine
          ref: master
          path: datamine
          sparse-checkout: |
            atlases.vromfs.bin_u/gameuiskin
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Analyze all original PNGs
        run: python scripts/analyze_datamine_icons.py

      - name: Upload full audit
        uses: actions/upload-artifact@v4
        with:
          name: datamine-gameuiskin-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
