name: Datamine mounted-icon audit

on:
  push:
    branches:
      - analysis/datamine-icon-audit-20261110

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Checkout Datamine data required by the solver
        uses: actions/checkout@v4
        with:
          repository: gszabi99/War-Thunder-Datamine
          ref: master
          path: datamine
          sparse-checkout: |
            aces.vromfs.bin_u/gamedata/flightmodels
            aces.vromfs.bin_u/gamedata/weapons
            aces.vromfs.bin_u/gamedata/damage_model/explosive.blkx
            char.vromfs.bin_u/config/wpcost.blkx
            char.vromfs.bin_u/config/warpoints.blkx
            lang.vromfs.bin_u/lang/units_weaponry.csv
            lang.vromfs.bin_u/lang/units.csv
            atlases.vromfs.bin_u/gameuiskin
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy requests

      - name: Generate the solver's actual aircraft mount options
        run: |
          python build_static_data.py --all \
            --datamine-root datamine \
            --output audit-generated/frontend/public/data \
            --clean

      - name: Resolve the exact iconType set referenced by pylons
        run: |
          python scripts/summarize_mount_icon_references.py \
            audit-generated/frontend/public/data \
            audit-generated/frontend/.icon-source \
            audit-output

      - name: Analyze only mounted icon PNGs
        run: |
          python scripts/analyze_datamine_icons.py \
            audit-generated/frontend/.icon-source \
            audit-output

      - name: Upload mounted-icon audit
        uses: actions/upload-artifact@v4
        with:
          name: datamine-mounted-icons-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
