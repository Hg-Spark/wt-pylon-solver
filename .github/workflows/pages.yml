name: Build and deploy wt-pylon-solver

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wt-pylon-solver-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wt-pylon-solver
        uses: actions/checkout@v4

      # Fail early when GitHub Pages has not been enabled in repository settings.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Checkout War Thunder Datamine
        uses: actions/checkout@v4
        with:
          repository: gszabi99/War-Thunder-Datamine
          path: .datamine
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aces.vromfs.bin_u/gamedata/flightmodels
            aces.vromfs.bin_u/gamedata/weapons
            atlases.vromfs.bin_u/gameuiskin
            aces.vromfs.bin_u/gamedata/damage_model/explosive.blkx
            char.vromfs.bin_u/config/wpcost.blkx
            char.vromfs.bin_u/config/warpoints.blkx
            lang.vromfs.bin_u/lang/units_weaponry.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data-build dependency
        run: pip install -r requirements.txt

      - name: Generate static aircraft data
        run: python build_static_data.py --all --clean --datamine-root .datamine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test pylon constraints
        working-directory: frontend
        run: node --experimental-strip-types --test tests/solver.test.mjs

      - name: Build static site
        working-directory: frontend
        run: npm run build

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wt-pylon-solver-static
          path: dist
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
