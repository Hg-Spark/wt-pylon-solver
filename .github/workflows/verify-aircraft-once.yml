name: Verify aircraft search build once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-aircraft-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify complete Cloudflare Pages build
        run: bash scripts/build_cloudflare_pages.sh
