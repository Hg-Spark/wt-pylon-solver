name: Bootstrap complete source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore complete source archive
        run: |
          cat .bootstrap/part* | base64 --decode > /tmp/wt-pylon-solver.zip
          unzip -t /tmp/wt-pylon-solver.zip
          unzip -o /tmp/wt-pylon-solver.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore complete wt-pylon-solver source"
          git push
